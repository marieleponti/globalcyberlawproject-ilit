name: CI

# Runs on every pull request and on every push to main. Deployment is a separate
# workflow that waits for this one, so a change that fails here never reaches
# the Droplet.

on:
  pull_request:
  push:
    # Not main. The deploy workflow calls this one for main, and triggering on
    # both would run every check twice for the same commit.
    branches-ignore: [main]
  # Lets deploy.yml reuse this workflow as a gate before touching the Droplet.
  workflow_call:
  workflow_dispatch:

# A newer push supersedes an in-flight run on the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Django checks and security scan
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # Throwaway values. `check --deploy` refuses to run without them, and the
      # real ones live in .env.production on the Droplet.
      DEBUG: "False"
      SECRET_KEY: ci-only-key-not-used-anywhere-real-0123456789abcdef
      ALLOWED_HOSTS: example.org
      POSTGRES_DB: ci
      POSTGRES_USER: ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/requirements.txt
          pip install bandit pip-audit

      - name: Django deployment checklist
        working-directory: src
        run: python manage.py check --deploy

      - name: Confirm no migrations are missing
        working-directory: src
        # --check exits non-zero if a model change has no migration. Catching it
        # here matters because the Droplet runs migrate on every boot.
        run: python manage.py makemigrations --check --dry-run

      - name: bandit (static analysis)
        run: |
          bandit -r src/ \
            --exclude src/staticfiles,src/core/migrations,src/core/tests.py \
            --skip B101 \
            --severity-level medium

      - name: pip-audit (known CVEs)
        # Advisory only. A CVE published in a transitive dependency should not
        # block an unrelated deploy, but it must be visible in the run log.
        continue-on-error: true
        run: pip-audit -r src/requirements.txt

  docker-build:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the web image
        # Built but not pushed. The Droplet builds its own image from the same
        # Dockerfile; this exists to catch a broken build before deployment.
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate the compose files
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.prod.yml --env-file .env.production.example config --quiet
