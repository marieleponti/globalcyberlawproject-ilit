# Production stack for the DigitalOcean Droplet.
#
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# Differences from the development docker-compose.yml:
#   - no source bind mount; the image is the unit of deployment
#   - neither web nor db publishes a port to the host; only nginx does
#   - Postgres data lives on a named volume that survives container rebuilds
#   - log rotation is capped so a Droplet disk cannot fill up
#
# See DEPLOY_DIGITALOCEAN.md for the full runbook.

services:
  db:
    image: postgres:17
    container_name: gclp_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Scrypt password hashing and checksums on every page read.
      POSTGRES_INITDB_ARGS: "--data-checksums --auth-host=scram-sha-256"
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true

  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: gclp-web:latest
    container_name: gclp_web
    restart: always
    env_file:
      - .env.production
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      PORT: "8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
      - frontend
    expose:
      - "8000"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true

  nginx:
    image: nginx:1.27-alpine
    container_name: gclp_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      WWW_DOMAIN: ${WWW_DOMAIN}
      HSTS_MAX_AGE: ${HSTS_MAX_AGE:-0}
      # Must match DJANGO_ADMIN_URL without its trailing slash, so the strict
      # rate limit follows the admin when it is moved off /admin/.
      ADMIN_PATH_RE: ${ADMIN_PATH_RE:-admin}
      # Read only by nginx/templates/eb-site.conf.template, a file that does
      # not exist until the EB site is switched on (see
      # nginx/eb-site.conf.template.example). With no such template these are
      # never used, so merging this changes nothing for the Django site. The
      # defaults are non-empty on purpose: an empty value would render
      # `server_name ;`, which fails `nginx -t` and stops nginx — and with it
      # this site — from starting.
      EB_FRONTEND_DOMAIN: ${EB_FRONTEND_DOMAIN:-eb-disabled.invalid}
      EB_WP_DOMAIN: ${EB_WP_DOMAIN:-eb-disabled.invalid}
      # Same arrangement for nginx/umami-site.conf.template.example (Umami
      # analytics): unused until that template is copied into templates/, and
      # non-empty for the same reason.
      UMAMI_DOMAIN: ${UMAMI_DOMAIN:-umami-disabled.invalid}
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - web
    networks:
      - frontend
      # Shared with the EB site's own docker-compose stack (eb-site-migracion/
      # infra), so this nginx can reach eb_frontend and eb_wp_nginx by name.
      # Harmless when that stack does not exist: nothing else is on it.
      - eb_shared_edge
    healthcheck:
      test: ["CMD-SHELL", "nginx -t || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    # The access log goes to stdout, so this is also how long traffic history
    # is kept: 6 x 50MB, which is months at current volumes.
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "6"
    security_opt:
      - no-new-privileges:true
    # Reload every 12h so renewed certificates are picked up without a restart.
    # The TERM trap matters: without it `docker stop` kills the shell and nginx
    # is SIGKILLed a moment later instead of draining its connections.
    command: >
      /bin/sh -c "
        trap 'nginx -s quit 2>/dev/null; exit 0' TERM INT;
        /docker-entrypoint.sh nginx -g 'daemon off;' &
        NGINX_PID=$$!;
        while :; do sleep 12h & wait $$!; nginx -s reload 2>/dev/null || true; done &
        wait $$NGINX_PID
      "

  certbot:
    image: certbot/certbot:latest
    container_name: gclp_certbot
    restart: unless-stopped
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Attempt renewal twice a day, as Let's Encrypt recommends. Renewal is a
    # no-op until the certificate is inside its 30-day window.
    entrypoint: >
      /bin/sh -c "
        trap exit TERM;
        while :; do
          certbot renew --webroot -w /var/www/certbot --quiet;
          sleep 12h & wait $${!};
        done
      "

  # -------------------------------------------------------------------------
  # Umami web analytics (optional; off by default).
  #
  # Both services sit behind the `analytics` profile, so a plain
  # `docker compose up` never starts them and merging this changes nothing for
  # the running sites. Switch on with:
  #
  #   docker compose -f docker-compose.prod.yml --env-file .env.production \
  #       --profile analytics up -d umami
  #
  # See ANALYTICS_UMAMI.md. Umami has its own Postgres rather than a database
  # inside `db`, so it can never touch the application data, a bad Umami
  # upgrade cannot lock the Django app out, and either can be wiped alone.
  # -------------------------------------------------------------------------
  umami_db:
    profiles: ["analytics"]
    image: postgres:17
    container_name: gclp_umami_db
    restart: always
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      # Left blank by default so an unconfigured start fails loudly (Postgres
      # refuses to initialise without a password) instead of running open.
      POSTGRES_PASSWORD: ${UMAMI_DB_PASSWORD:-}
      POSTGRES_INITDB_ARGS: "--data-checksums --auth-host=scram-sha-256"
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    volumes:
      - umami_db_data:/var/lib/postgresql/data
    networks:
      - analytics_backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami -d umami"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true

  umami:
    profiles: ["analytics"]
    # Rolling tag on purpose: pin it (e.g. postgresql-v2.x.y) once the version
    # in use is known, so an upgrade is a decision and not a side effect of
    # `pull`.
    image: ghcr.io/umami-software/umami:postgresql-latest
    container_name: gclp_umami
    restart: always
    environment:
      DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD:-}@umami_db:5432/umami
      DATABASE_TYPE: postgresql
      # Signs sessions; changing it logs everyone out. openssl rand -base64 32
      APP_SECRET: ${UMAMI_APP_SECRET:-}
    # Don't let a 2GB Droplet shared with Django and nginx be starved.
    mem_limit: 512m
    depends_on:
      umami_db:
        condition: service_healthy
    networks:
      # nginx reaches it over `frontend`; the database is on the internal net.
      - frontend
      - analytics_backend
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/api/heartbeat || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true

networks:
  # db is reachable only from web; nginx has no route to it at all.
  backend:
    driver: bridge
    internal: true
  # Umami's database, reachable only from the umami container.
  analytics_backend:
    driver: bridge
    internal: true
  frontend:
    driver: bridge
  # Defined (and so created) here, not declared external: this stack can then
  # never fail to start because the network is missing. The EB site's compose
  # file declares it external and attaches to it.
  eb_shared_edge:
    name: eb_shared_edge
    driver: bridge

volumes:
  postgres_data:
  umami_db_data:
  certbot_conf:
  certbot_www:
