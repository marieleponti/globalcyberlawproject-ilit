# Included inside every HTTPS `server` block (see default.conf.template and
# eb-site.conf.template.example). Mounted at /etc/nginx/snippets, which is not
# a templates directory, so no envsubst runs on it.

# Log to the container's stdout (so `docker compose logs` keeps working) in the
# format that carries the host. A server-level access_log replaces the image's
# default one, so each request is logged once.
access_log /dev/stdout gclp_host;

# Scanners probe for secrets and config files all day. Answer 404 here and keep
# them out of the log, so traffic reports are not drowned in them and a file
# left in a served directory by mistake is never handed out. The negative
# lookahead keeps /.well-known/ (Let's Encrypt renewals) working.
location ~ /\.(?!well-known/) {
    access_log off;
    return 404;
}

# Named files only. Generic names such as config.js or settings.json are left
# alone on purpose: a front-end bundle or a static asset could legitimately
# use them.
location ~* ^/(?:.*/)?(?:wp-config\.php(?:\.bak)?|phpinfo\.php|secrets\.json|appsettings(?:\.\w+)?\.json|application\.ya?ml|docker-compose\.ya?ml|aws-exports\.js)$ {
    access_log off;
    return 404;
}
