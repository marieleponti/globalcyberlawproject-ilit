{% extends 'core/base.html' %}

{% block content %}

<section class="method-header">
    <div class="method-container">
        <h1>About</h1>
    </div>
</section>

<section class="about-section">
    <div class="about-container">
        </div>
</section>


<style>
    .method-header {
        background-color: #f9f9f9;
        padding: 50px 0 30px;
        font-family: 'Open Sans', Arial, sans-serif;
        border-bottom: 3px solid var(--temple-cherry, #A41E35);
    }

    .method-header h1 {
        color: var(--temple-cherry, #A41E35);
        font-size: 36px;
        font-weight: 700;
        text-transform: uppercase;
        margin: 0;
    }

    .method-container {
        max-width: 900px;
        margin: 0 auto;
        padding: 0 20px;
    }

    .method-section {
        padding: 45px 0;
        font-family: 'Open Sans', Arial, sans-serif;
        color: #444;
    }

    .method-section.alt {
        background-color: #f9f9f9;
    }

    .method-section h2 {
        color: var(--temple-cherry, #A41E35);
        font-size: 24px;
        font-weight: 700;
        margin: 0 0 20px;
    }

    .method-section p {
        font-size: 16px;
        line-height: 1.7;
        margin: 0 0 16px;
    }

    .method-section .method-note {
        font-size: 15px;
        font-style: italic;
        color: #666;
        margin: 12px 0 0;
    }

    .method-section .method-lead-in {
        margin: 14px 0 8px;
        font-weight: 600;
        color: #333;
    }

    .method-list {
        margin: 0 0 16px;
        padding-left: 22px;
        line-height: 1.7;
    }

    .method-list li {
        margin-bottom: 8px;
    }

    .method-codes {
        margin: 0 0 16px;
        padding-left: 22px;
        line-height: 1.7;
    }

    .method-codes li {
        margin-bottom: 6px;
    }

    .method-steps {
        margin: 20px 0 0;
        padding-left: 24px;
        counter-reset: step;
    }

    .method-steps > li {
        margin-bottom: 22px;
        line-height: 1.7;
        padding-left: 6px;
    }

    .method-steps > li::marker {
        font-weight: 700;
        color: var(--temple-cherry, #A41E35);
    }

    .method-substeps {
        margin: 12px 0 0;
        padding-left: 24px;
        line-height: 1.7;
        color: #555;
    }

    .method-substeps li {
        margin-bottom: 6px;
    }

    @media (max-width: 768px) {
        .method-header h1 {
            font-size: 28px;
        }

        .method-section h2 {
            font-size: 21px;
        }
    }
</style>

{% endblock content %}
